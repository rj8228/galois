<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress lens</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.chip{font:500 12px/1 'IBM Plex Mono',monospace;color:#a9b3a8;background:transparent;border:1px solid #3d4d45;border-radius:999px;padding:0 13px;height:34px;white-space:nowrap;flex:none}
.chip.on{background:#f2d16b;color:#1e2a25;border-color:#f2d16b}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#a9b3a8;font:12px 'IBM Plex Sans',sans-serif;min-height:52px;justify-content:center}
.tab.on{color:#f2d16b}
.row{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:10px}
.nm{font:600 14px/1.2 'IBM Plex Sans',sans-serif}
.ct{font:500 13px/1 'IBM Plex Mono',monospace;text-align:right}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.c{width:20px;height:20px;border-radius:5px;box-sizing:border-box}
.e{width:20px;height:12px;border-radius:6px;box-sizing:border-box;align-self:center}
.ok{background:#8fd49a}
.no{border:2px solid #56675e}
.half{border:2px solid #f2d16b}
.st{font:500 11px/1 'IBM Plex Mono',monospace;padding:7px 8px;border-radius:6px;white-space:nowrap}
.k{font-size:12px;color:#a9b3a8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1e2a25; color: #ecebe3; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column">
<div style="padding: 16px 16px 6px; display: flex; flex-direction: column; gap: 2px">
<div style="font: 500 11px/1 'IBM Plex Mono', monospace; letter-spacing: .08em; color: #a9b3a8">PLAY · LENS</div>
<h1 style="margin: 0; font: 700 30px/1.15 Kalam, cursive; color: #ecebe3">Progress</h1>
</div>
<div style="display: flex; gap: 6px; padding: 6px 16px 10px; overflow: hidden">
<button class="chip" type="button">Path</button>
<button class="chip" type="button">Tree</button>
<button class="chip on" type="button" aria-pressed="true">Progress</button>
<button class="chip" type="button">Top</button>
<button class="chip" type="button">Home</button>
<button class="chip" type="button">Graph</button>
</div>
<div style="margin: 4px 16px 0; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="k">pieces home and straight</span>
<span style="font: 700 56px/1 Kalam, cursive; color: #8fd49a">13<span style="color: #a9b3a8; font-size: 30px"> / 20</span></span>
</div>
<div style="width: 120px; height: 10px; border-radius: 5px; background: #33433b; overflow: hidden; margin-bottom: 14px"><div style="width: 65%; height: 100%; background: #8fd49a"></div></div>
</div>
<div style="margin: 16px 16px 0; background: #26342e; border: 1px solid #3d4d45; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 16px">
<div class="row">
<span class="nm">Top</span>
<div class="dots"><span class="c no" aria-label="UFR corner not home"></span><span class="c half" aria-label="URB corner turned right but in the wrong slot"></span><span class="c no" aria-label="UBL corner not home"></span><span class="c no" aria-label="ULF corner not home"></span><span class="e ok" aria-label="UF edge home"></span><span class="e half" aria-label="UR edge flat, wrong slot"></span><span class="e half" aria-label="UB edge flat, wrong slot"></span><span class="e half" aria-label="UL edge flat, wrong slot"></span></div>
<span class="ct" style="color: #f2d16b">1/8</span>
</div>
<div class="row">
<span class="nm">Middle</span>
<div class="dots"><span class="e ok"></span><span class="e ok"></span><span class="e ok"></span><span class="e ok"></span></div>
<span class="ct" style="color: #8fd49a">4/4</span>
</div>
<div class="row">
<span class="nm">Bottom</span>
<div class="dots"><span class="c ok"></span><span class="c ok"></span><span class="c ok"></span><span class="c ok"></span><span class="e ok"></span><span class="e ok"></span><span class="e ok"></span><span class="e ok"></span></div>
<span class="ct" style="color: #8fd49a">8/8</span>
</div>
<div style="display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #a9b3a8">
<span style="display: flex; gap: 6px; align-items: center"><span class="c ok" style="width: 12px; height: 12px"></span>home</span>
<span style="display: flex; gap: 6px; align-items: center"><span class="c half" style="width: 12px; height: 12px"></span>right way up, wrong slot</span>
<span style="display: flex; gap: 6px; align-items: center"><span class="c no" style="width: 12px; height: 12px"></span>not yet</span>
</div>
</div>
<div style="margin: 14px 16px 0; display: flex; gap: 5px; flex-wrap: wrap">
<span class="st" style="background: #33433b; color: #8fd49a">✓ Cross</span>
<span class="st" style="background: #33433b; color: #8fd49a">✓ Layer 1</span>
<span class="st" style="background: #33433b; color: #8fd49a">✓ Layer 2</span>
<span class="st" style="background: #f2d16b; color: #1e2a25">Top colour</span>
<span class="st" style="border: 1px solid #3d4d45; color: #a9b3a8">Top pieces</span>
</div>
<div style="margin: 14px 16px 0; background: #26342e; border: 1px solid #3d4d45; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 14px; line-height: 1.45">Two layers done. Next, turn the top all one colour. Edges are already flat; three corners are twisted.</p>
<a href="Top.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #f2d16b; color: #1e2a25; font: 600 14px/1 'IBM Plex Sans', sans-serif; text-decoration: none">Open the Top lens</a>
</div>
<div style="flex: 1"></div>
<nav aria-label="Sections" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #3d4d45; padding: 4px 0 10px">
<button class="tab" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>Learn</button>
<button class="tab" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7.5 14h9"/></svg>Labs</button>
<button class="tab on" type="button" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 8l7-4 7 4v8l-7 4-7-4zM5 8l7 4 7-4M12 12v8"/></svg>Play</button>
<button class="tab" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 6h14v14H5zM5 10h14M9 3v4M15 3v4M9 14h2v2H9z"/></svg>Daily</button>
<button class="tab" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 4a6 6 0 1 0 0 12a6 6 0 1 0 0-12M15 15l5 5"/></svg>Decode</button>
</nav>
</div>
</x-dc>

</body>
</html>
